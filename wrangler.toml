name = "opentao"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Cloudflare Workers-with-Assets — src/worker.ts handles /api/* (taostats
# proxy) and falls through to the ASSETS binding for everything else.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Secrets (set via `wrangler secret put`, not in this file):
#   TAOSTATS_KEY — required for /api/subnet/[netuid]. Get one at https://taostats.io/pro.
