name: Refresh chain data

# Every 6 hours, pull live numbers from Taostats and commit:
#   - src/data/chain-stats.json  (landing-page glance stats)
#   - src/data/subnets.ts        (subnet registry — also powers /mining-data.json + the MCP)
# The commit triggers Cloudflare's auto-deploy of opentao.ai, which rebuilds
# /mining-data.json, so the site and the OpenTAO MCP stay in sync.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # open/comment a tracking issue when the cron fails

concurrency:
  group: refresh-chain-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch chain-stats glance numbers
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
        run: bun run scripts/fetch-chain-stats.ts

      # taostats free tier is ~5 req/min. The step above already spent ~4 calls;
      # wait out the window so this step's calls don't trip a 429 (the scripts
      # also retry/backoff on 429 as a safety net).
      - name: Wait out taostats rate-limit window
        run: sleep 60

      - name: Refresh subnet registry
        env:
          TAOSTATS_API_KEY: ${{ secrets.TAOSTATS_API_KEY }}
        run: bun run scripts/refresh-subnets.ts > src/data/subnets.ts

      - name: Commit & push if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/chain-stats.json src/data/subnets.ts
          if git diff --cached --quiet; then
            echo "No chain data changed — nothing to commit."
            exit 0
          fi

          git commit -m "chore: refresh chain data (auto)"
          git push

      # Don't let this cron fail silently again (it was broken 5 days unnoticed).
      # On failure, open a tracking issue — or comment on the existing one so we
      # don't spawn a new issue every 6h while it stays broken.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled **Refresh chain data** workflow failed.

          - Run log: ${run_url}
          - Most likely cause: taostats rate-limit (429) or an API change. The fetch wrappers retry/backoff on 429, so a persistent failure usually means an API/auth change or an outage.

          This issue auto-closes the next time the cron succeeds."
          existing=$(gh issue list --state open --search "Refresh chain data cron failing in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "⚠️ Refresh chain data cron failing" --body "$body"
          fi

      # On a clean success, close any open failure issue so it reflects reality.
      - name: Resolve failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "Refresh chain data cron failing in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Cron succeeded again in run ${{ github.run_id }} — auto-closing."
          fi
